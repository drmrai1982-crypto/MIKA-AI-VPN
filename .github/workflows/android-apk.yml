name: Build MIKA AI VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - mika-ai-vpn-final
    paths:
      - "app/**"
      - "core/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: mika-ai-vpn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build signed ARM64 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK, CMake and Ninja
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/aether/target-android
          key: ${{ runner.os }}-cargo-android-arm64-${{ hashFiles('core/aether/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-arm64-

      - name: Restore release signing key
        env:
          AETHERY_KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
        run: |
          test -n "$AETHERY_KEYSTORE_BASE64"
          printf '%s' "$AETHERY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mika-ai-vpn-release.jks"
          test -s "$RUNNER_TEMP/mika-ai-vpn-release.jks"

      - name: Build signed release APK
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew core/build-android.sh
          ./gradlew --no-daemon assembleRelease -PtargetAbi=arm64-v8a -PaetheryKeystore="$RUNNER_TEMP/mika-ai-vpn-release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MIKA-AI-VPN-ARM64-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
