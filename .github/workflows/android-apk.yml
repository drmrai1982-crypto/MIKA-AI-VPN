name: Build MIKA AI VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - mika-ai-vpn-final
    paths:
      - "app/**"
      - "core/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: mika-ai-vpn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build ARM64 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK, CMake and Ninja
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/aether/target-android
          key: ${{ runner.os }}-cargo-android-arm64-${{ hashFiles('core/aether/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-arm64-

      - name: Build debug APK
        run: |
          chmod +x gradlew core/build-android.sh
          ./gradlew --no-daemon assembleDebug -PtargetAbi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIKA-AI-VPN-ARM64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
